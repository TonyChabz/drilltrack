<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3D4F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>DrillTrack Field</title>
<style>
:root{--bg:#FFFFFF;--panel:#F3F6F8;--ink:#14202B;--muted:#5D6B78;--line:#DCE3E8;--pri:#0B3D4F;--pri-ink:#FFFFFF;--acc:#F59E0B;--sand:#D9A441;--ok:#1F8A4C;--ok-soft:#E3F4EA;
--bad:#C4321F;--bad-soft:#FBE7E3;--warn:#A86400;--warn-soft:#FDF0DC;--chip:#EEF3F5;--shadow:0 1px 3px rgba(11,61,79,.10);--field:#FFFFFF;
--s-travelling:#3B82F6;--s-on_site:#8B5CF6;--s-drilling:#F59E0B;--s-returning:#14B8A6;--s-planned:#94A3B8;--s-completed:#64748B;--s-cancelled:#64748B;--s-breakdown:#EF4444;
--head:Cambria,"Cambria Math",Georgia,"Times New Roman",serif;--body:Calibri,Carlito,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1F28;--panel:#11303D;--ink:#E7EEF2;--muted:#9FB3BE;--line:#21485A;--chip:#173B4A;--field:#0E2833;
--ok-soft:#14301f;--bad-soft:#3a1914;--warn-soft:#3a2a10;--pri:#0B3D4F;--pri-ink:#FFFFFF}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
h1,h2,.status{font-family:var(--head)}
button,select,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:1001;background:var(--pri);color:var(--pri-ink);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;flex:1;font-weight:700}
header .gps{font-size:12px;padding:3px 8px;border-radius:12px;background:rgba(255,255,255,.18);white-space:nowrap}
header .gps.on{background:#e53935;color:#fff}
main{padding:12px 16px 96px;max-width:640px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:1001;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;padding:8px 2px 9px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--pri);font-weight:700}
@media (prefers-color-scheme:dark){nav button.on{color:var(--acc)}}
nav .dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{font-size:20px;margin:0 0 8px;color:var(--pri)}
@media (prefers-color-scheme:dark){.card h2{color:var(--ink)}}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px;font-weight:600;cursor:pointer;margin:6px 0;min-height:48px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.big{font-size:18px;min-height:60px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px}.row>*{flex:1}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);min-height:46px}
textarea{min-height:70px}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
details>summary{list-style:none;padding:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary:after{content:"▾";margin-left:auto;transition:transform .2s;color:var(--muted)}
details[open]>summary:after{transform:rotate(180deg)}
details>.in{padding:0 14px 14px}
.chip{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;background:var(--chip)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.status{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.status i{width:16px;height:16px;border-radius:50%;display:inline-block}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:12px 0 4px}
.steps div{height:6px;border-radius:3px;background:var(--line)} .steps div.d{background:var(--ok)} .steps div.c{background:var(--acc)}
.stepl{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li .grow{flex:1;min-width:0}
.clear{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.clear:last-child{border-bottom:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:8px 10px;font-size:13px;min-height:40px}
.seg button.on{background:var(--ok);color:#fff}.seg button.on.x{background:var(--bad)}
.num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;font-size:14px;flex:none}
#map{height:300px;border-radius:10px;border:1px solid var(--line);background:#cfe3f3}
@media (prefers-color-scheme:dark){#map{background:#10283d}}
.count{font-variant-numeric:tabular-nums;font-weight:700}
.toast{position:fixed;left:16px;right:16px;bottom:84px;z-index:2000;background:#14202b;color:#fff;padding:12px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-size:14px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{font-weight:600}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px;font-size:14px;margin:8px 0}
.badbox{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px;font-size:14px;margin:8px 0}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:10px;font-size:14px;margin:8px 0}
/* Leaflet core (minimal) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:none}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}
.leaflet-map-pane svg{z-index:200}.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-marker-icon,.leaflet-pane>svg path{pointer-events:none}.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{float:right;margin-right:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-bar{border-radius:6px;border:1px solid var(--line);box-shadow:var(--shadow)}
.leaflet-bar a{background:var(--panel);color:var(--ink);display:block;width:34px;height:34px;line-height:34px;text-align:center;text-decoration:none;font-weight:700;border-bottom:1px solid var(--line)}
.leaflet-bar a:last-child{border-bottom:none}
.leaflet-tooltip{position:absolute;padding:2px 6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;white-space:nowrap;pointer-events:none;font-size:12px}
.leaflet-control-attribution{display:none}
</style>
</head>
<body>
<header><h1 id="htitle">DrillTrack Field</h1><span id="gps" class="gps">GPS off</span></header>
<main id="main"></main>
<nav id="nav"></nav>

function pip(x,y,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const[xi,yi]=r[i],[xj,yj]=r[j];if((yi>y)!=(yj>y)&&x<(xj-xi)*(y-yi)/((yj-yi)||1e-15)+xi)c=!c}return c}

function trip(){return S.trips.find(t=>t.trip_id===S.cur)||null}
function openTrip(){return S.trips.find(t=>!["completed","cancelled"].includes(t.status))||null}
function ev(t,type,note){const p=lastFix();t.events.push({at:nowISO(),type,note:note||"",lon:p?p[0]:null,lat:p?p[1]:null})}
function lastFix(){const t=trip();const tr=t&&t.track;return tr&&tr.length?tr[tr.length-1]:(G.last||null)}

/* ---------- BCR timing ---------- */
function bcrState(b){
 const g=OUT_GROUP[b.status]||"pending";
 if(g==="pending"||g==="active")return{st:"none"};
 if(g==="stopped"&&!(+b.depth_m>0))return{st:"none"};
 if(!b.completed_at)return{st:"none"};
 const due=new Date(b.completed_at).getTime()+BCR_HOURS*3600e3;
 if(b.bcr&&b.bcr.submitted_at)return{st:"done",due};
 const left=due-Date.now();
 return{st:left<0?"late":left<24*3600e3?"soon":"open",due,left};
}
function leftText(ms){const a=Math.abs(ms),d=Math.floor(a/864e5),h=Math.floor(a%864e5/36e5);return (d?d+" d ":"")+h+" h"}
function bcrDue(){let n=0;S.trips.forEach(t=>t.boreholes.forEach(b=>{const s=bcrState(b).st;if(s==="late"||s==="soon"||s==="open")n++}));return n}

/* ---------- GPS ---------- */
const G={watch:null,last:null,sim:null,wake:null};
function gpsOn(){
 if(G.watch!==null||G.sim)return;
 if(!navigator.geolocation){toast("This phone/browser has no GPS access. Use GeoTracker and import the GPX.");return}
 G.watch=navigator.geolocation.watchPosition(onFix,e=>{if(e.code===1){toast("Location is blocked – allow location for this app in the phone settings",5000);gpsOff()}else $("#gps").textContent="● GPS searching…"},{enableHighAccuracy:true,maximumAge:10000,timeout:60000});
 keepAwake();paintGps();
}
function gpsOff(){if(G.watch!==null)navigator.geolocation.clearWatch(G.watch);G.watch=null;if(G.sim){clearInterval(G.sim);G.sim=null}releaseAwake();paintGps()}
async function keepAwake(){try{if("wakeLock"in navigator)G.wake=await navigator.wakeLock.request("screen")}catch(e){}}
function releaseAwake(){try{G.wake&&G.wake.release()}catch(e){}G.wake=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&(G.watch!==null||G.sim))keepAwake()});
function onFix(pos){
 const p=[+pos.coords.longitude.toFixed(6),+pos.coords.latitude.toFixed(6),Date.now(),Math.round(pos.coords.accuracy||0)];
 const sp=pos.coords.speed;G.last=p;
 const t=openTrip();
 if(t&&["travelling","on_site","drilling","returning"].includes(t.status)){
  const tr=t.track,l=tr[tr.length-1];
  const every=(S.settings.every||30)*1000;
  if(!l||p[2]-l[2]>=every||dist(l,p)>=40){tr.push(p);save();ping(p,sp);if(S.tab==="trip")drawTrip()}
 }
 paintGps();
}
function ping(p,speed){
 const u=S.settings.traccar;if(!u||!S.profile)return;
 const id=encodeURIComponent(S.profile.rig.tracker_id||S.profile.rig.rig_id);
 const q=`${u.replace(/\/$/,"")}/?id=${id}&lat=${p[1]}&lon=${p[0]}&timestamp=${Math.round(p[2]/1000)}&accuracy=${p[3]||0}`+(speed!=null?`&speed=${(speed*1.94384).toFixed(1)}`:"");
 fetch(q,{method:"GET",mode:"no-cors"}).catch(()=>{});
}
function paintGps(){const e=$("#gps");const on=G.watch!==null||G.sim;e.className="gps"+(on?" on":"");e.textContent=on?(G.sim?"● TRAINING GPS":"● REC GPS"):"GPS off"}
function simulate(){
 const t=openTrip();if(!t){toast("Start a trip first");return}
 const a=G.last||S.profile.depot||[28.2833,-15.4167];const tgt=(t.boreholes[0]||{}).approved||[a[0]+.3,a[1]-.2];
 let i=0;const n=40;gpsOff();
 G.sim=setInterval(()=>{i++;const f=Math.min(1,i/n);const lon=a[0]+(tgt[0]-a[0])*f+Math.sin(f*9)*.004,lat=a[1]+(tgt[1]-a[1])*f;
  onFix({coords:{longitude:lon,latitude:lat,accuracy:8,speed:16}});
  const tr=openTrip()&&openTrip().track;if(tr&&tr.length&&Date.now()-tr[tr.length-1][2]<1000){}else if(tr){tr.push([+lon.toFixed(6),+lat.toFixed(6),Date.now(),8]);save();if(S.tab==="trip")drawTrip()}
  if(f>=1){clearInterval(G.sim);G.sim=null;paintGps();toast("Training drive finished – you are at BH1")}},700);
 paintGps();
}

function photoInput(cb){const i=document.createElement("input");i.type="file";i.accept="image/*";i.capture="environment";
 i.onchange=()=>{const f=i.files[0];if(!f)return;const img=new Image();img.onload=()=>{const k=Math.min(1,720/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb({name:f.name,at:nowISO(),data:c.toDataURL("image/jpeg",.6)})};img.src=URL.createObjectURL(f)};i.click()}

function home(){
 const t=openTrip(),P=S.profile;
 let h=`<div class="card"><div class="small muted">${esc(P.company)} · Class ${esc(P.class||"?")} · Licence ${esc(P.licence)}</div>`;
 if(!t){h+=`<div class="status"><i style="background:var(--s-completed)"></i>No trip running</div>
  <p class="muted small">Start a trip before the rig leaves the depot. You need the permit numbers and the approved points.</p>
  <button class="btn pri big" id="new">＋ Start a new trip</button><button class="btn" id="pack">Open a WARMA trip pack (file)</button></div>`}
 else{const i=TRIP_STEPS.findIndex(s=>s[0]===t.status);
  h+=`<div class="status"><i style="background:var(--s-${t.status})"></i>${STATUS_LABEL[t.status]}</div>
  <div class="small">${esc(t.client)} · ${esc(t.district||"")} · Permit ${esc(t.permit_no||"none")}</div>
  <div class="steps">${TRIP_STEPS.map((s,k)=>`<div class="${k<i?"d":k===i?"c":""}"></div>`).join("")}</div><div class="stepl">${TRIP_STEPS.map(s=>`<span>${s[1]}</span>`).join("")}</div>
  ${nextAction(t)}</div>`}
 const due=[];S.trips.forEach(x=>x.boreholes.forEach(b=>{const s=bcrState(b);if(["late","soon","open"].includes(s.st))due.push([x,b,s])}));
 if(due.length)h+=`<div class="card"><h2>BCR to send (3 days per borehole)</h2><ul class="list">${due.map(([x,b,s])=>`<li><div class="grow"><b>${esc(b.label)}</b><div class="small muted">${esc(OUT_LABEL[b.status])}</div></div>

 const past=S.trips.filter(x=>x!==t).slice(-5).reverse();
 if(past.length)h+=`<details><summary>Past trips (${S.trips.length-(t?1:0)})</summary><div class="in"><ul class="list">${past.map(x=>`<li><div class="grow"><b>${esc(x.client)}</b><div class="small muted">${esc(x.trip_id)} · ${fmt(x.depart_at)}</div></div><span class="chip">${esc(x.status)}</span></li>`).join("")}</ul></div></details>`;
 h+=`<details><summary>My rig and crew</summary><div class="in"><div class="kv"><b>Rig</b><span>${esc(P.rig.reg_no)} · ${esc((RIG_TYPES.find(r=>r[0]===P.rig.type)||[])[1])}</span><b>Supervisor</b><span>${esc(P.crew.supervisor)} ${esc(P.crew.phone)}</span><b>Driller</b><span>${esc(P.crew.driller)}</span><b>Hydrogeologist</b><span>${esc(P.crew.hydrogeologist)}</span></div>
  <button class="btn" id="edit">Change details</button></div></details>`;
 $("#main").innerHTML=h;
 const n=$("#new");if(n)n.onclick=newTrip;const pk=$("#pack");if(pk)pk.onclick=openPack;
 $("#edit").onclick=()=>{S.editing=true;save();render()};
 bindNext();
}
function nextAction(t){
 const left=t.boreholes.filter(b=>["planned","drilling"].includes(b.status)).length;
 switch(t.status){
  case"planned":{const miss=CLEARANCES.filter(c=>c[0]!=="zema"&&(t.clearances.find(x=>x.code===c[0])||{}).status!=="ok");
   return (miss.length?`<div class="warnbox">${miss.length} paperwork item(s) not ticked. WARMA will see this.</div>`:`<div class="okbox">Paperwork complete.</div>`)+
   `<button class="btn" data-tab="trip">Check paperwork</button><button class="btn pri big" data-act="depart">Leaving the depot now</button><button class="btn bad" data-act="cancel">Cancel this trip</button>`}
  case"travelling":return`<button class="btn pri big" data-act="arrive">Arrived on site – notify WARMA</button><button class="btn" data-tab="trip">Map and GPS</button>`;
  case"on_site":case"drilling":return left?`<button class="btn pri big" data-tab="holes">Record boreholes (${left} left)</button><button class="btn" data-act="return">All done – rig returning</button>`:`<button class="btn pri big" data-act="return">All holes done – rig returning</button>`;
  case"returning":return`<button class="btn pri big" data-act="close">Back at depot – close trip</button>`;
 }return"";
}
function bindNext(){document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act))}
function act(a){
 const t=openTrip();if(!t)return;
 if(a==="depart"){t.status="travelling";t.depart_at=nowISO();ev(t,"depart");gpsOn();toast("Trip started – keep the app open with the screen on while driving")}
 if(a==="arrive"){t.status="on_site";ev(t,"arrive");ev(t,"notice","Drilling-day notice");
  const c=t.clearances.find(x=>x.code==="notice");if(c)c.status="ok";else t.clearances.push({code:"notice",status:"ok",at:nowISO()});
  const p=lastFix();if(p&&t.boreholes[0]){const d=dist(p,t.boreholes[0].approved);if(d>500)toast(`You are ${(d/1000).toFixed(1)} km from BH1's approved point`)}
  toast("Drilling-day notice saved. Press Send to WARMA when you have signal.")}
 if(a==="return"){if(t.boreholes.some(b=>b.status==="drilling")){toast("Record the outcome of the hole being drilled first");return}
  t.status="returning";ev(t,"leave_site")}
 if(a==="close"){t.status="completed";t.return_at=nowISO();ev(t,"return");gpsOff();toast("Trip closed. Remember the BCRs and press Send.")}
 if(a==="cancel"){if(!confirm("Cancel this trip?"))return;t.status="cancelled";ev(t,"cancel");gpsOff()}
 save();render();
}

 S.trips.push(t);S.cur=t.trip_id;S.tab="trip";save();render();
}
function openPack(){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
 i.onchange=async()=>{try{const pk=JSON.parse(await i.files[0].text());if(pk.format!==FORMAT||!pk.trips)throw 0;
  pk.trips.forEach(x=>{if(S.trips.find(y=>y.trip_id===x.trip_id)){toast("Trip "+x.trip_id+" is already on this phone");return}
   S.trips.push({...x,status:"planned",events:x.events||[],track:[],clearances:x.clearances||[],crew:{...S.profile.crew}});S.cur=x.trip_id});
  S.tab="trip";save();render();toast("Trip pack opened – check the paperwork")}catch(e){toast("That file is not a DrillTrack trip pack")}};i.click()}

 $("#m").onclick=()=>{$("#nb").value=Math.max(1,(parseInt($("#nb").value)||1)-1);sv()};$("#p").onclick=()=>{$("#nb").value=(parseInt($("#nb").value)||1)+1;sv()};
 const addPt=(lon,lat)=>{if(!(lat<-7&&lat>-19&&lon>21&&lon<34)){toast("That point is not in Zambia – check the numbers (latitude is negative)");return}
  t.boreholes.push({bh_id:`${t.trip_id}-BH${t.boreholes.length+1}`,label:`BH${t.boreholes.length+1} ${t.client}`.trim(),approved:[+lon,+lat],status:"planned",permit_no:t.permit_no});
  if(t.boreholes.length>t.planned_boreholes)t.planned_boreholes=t.boreholes.length;
  const cc=catchAt(+lon,+lat);if(cc&&!t.catchment)t.catchment=cc;if(cc&&t.boreholes.length===1)t.catchment=cc;
  save();tripView();if(cc)toast("Point is in the "+CATCH[cc]+" Catchment")};
 $("#addpt").onclick=()=>{sv();addPt(parseFloat($("#lon").value),parseFloat($("#lat").value))};
 $("#addgps").onclick=()=>{sv();const p=lastFix();if(!p){toast("No GPS fix yet – press Start GPS and wait");gpsOn();return}addPt(p[0],p[1])};
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const i=+b.dataset.del;if(t.boreholes[i].status!=="planned"){toast("This hole already has a record");return}t.boreholes.splice(i,1);save();tripView()});
 document.querySelectorAll("[data-cl]").forEach(b=>b.onclick=()=>{let x=t.clearances.find(y=>y.code===b.dataset.cl);if(!x){x={code:b.dataset.cl};t.clearances.push(x)}
  x.status=b.dataset.v;x.at=nowISO();if(b.dataset.cl==="permit")x.ref=t.permit_no;save();sv();tripView()});
 document.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>photoInput(ph=>{let x=t.clearances.find(y=>y.code===b.dataset.ph);if(!x){x={code:b.dataset.ph,status:"ok"};t.clearances.push(x)}(x.photos=x.photos||[]).push(ph);save();tripView()}));
 $("#gpsb").onclick=()=>{G.watch!==null?gpsOff():gpsOn();tripView()};
 $("#here").onclick=()=>{const p=lastFix();if(p&&map)map.setView([p[1],p[0]],13);else toast("No GPS fix yet")};
 $("#gpx").onclick=importGpx;$("#sim").onclick=simulate;
 bindNext();setupMap();drawTrip();
}
function clearOk(t){return CLEARANCES.every(c=>c[0]==="zema"||(t.clearances.find(x=>x.code===c[0])||{}).status==="ok")}
function setupMap(){
 map=L.map("map",{zoomControl:true,attributionControl:false,preferCanvas:false});lyr=L.layerGroup().addTo(map);drawTrip.fitted=false;
 const css=getComputedStyle(document.documentElement);const ink=css.getPropertyValue("--muted");
 BASE.catch.forEach(c=>c.rings.forEach(r=>L.polygon(r.map(p=>[p[1],p[0]]),{color:"#7aa2c7",weight:1,fillColor:"#f6f1e3",fillOpacity:.9}).addTo(map)));
 BASE.prov.forEach(p=>(p.r||[]).forEach(r=>L.polyline(r.map(q=>[q[1],q[0]]),{color:"#9aa7b3",weight:.8,dashArray:"3 3"}).addTo(map)));
 BASE.lakes.forEach(l=>L.polygon(l.c.map(q=>[q[1],q[0]]),{color:"#4c8fd6",weight:1,fillColor:"#8cc0ee",fillOpacity:1}).addTo(map));
 BASE.rivers.forEach(r=>L.polyline(r.c.map(q=>[q[1],q[0]]),{color:"#4c8fd6",weight:r.t===1?1.8:0.9}).addTo(map));
 BASE.roads.forEach(r=>L.polyline(r.c.map(q=>[q[1],q[0]]),{color:"#c99a5b",weight:1}).addTo(map));
 BASE.towns.forEach(t=>L.circleMarker([t[2],t[1]],{radius:3,color:"#333",weight:1,fillColor:"#fff",fillOpacity:1}).bindTooltip(t[0],{permanent:t[3]<=3,direction:"right",className:""}).addTo(map));
 map.setView([-13.3,27.8],5);
}
function drawTrip(){
 if(!map||!lyr)return;const t=trip()||openTrip();if(!t)return;lyr.clearLayers();
 const col={success:"#1f9d55",fail:"#d93025",stopped:"#e08a00",pending:"#ffffff",active:"#f2b705"};
 t.boreholes.forEach(b=>{if(b.approved){L.circle([b.approved[1],b.approved[0]],{radius:30,color:"#d93025",weight:1,fill:false}).addTo(lyr);
  L.circleMarker([b.approved[1],b.approved[0]],{radius:7,color:"#222",weight:2,fillColor:col[OUT_GROUP[b.status]||"pending"],fillOpacity:1}).bindTooltip(b.label.split(" ")[0],{permanent:true,direction:"top"}).addTo(lyr)}
  if(b.actual)L.circleMarker([b.actual[1],b.actual[0]],{radius:4,color:"#000",weight:1,fillColor:"#000",fillOpacity:1}).addTo(lyr)});
 if(t.track.length>1)L.polyline(t.track.map(p=>[p[1],p[0]]),{color:"#e53935",weight:4}).addTo(lyr);
 const p=lastFix();if(p)L.circleMarker([p[1],p[0]],{radius:8,color:"#fff",weight:3,fillColor:"#1a73e8",fillOpacity:1}).addTo(lyr);
 const pts=[...t.boreholes.filter(b=>b.approved).map(b=>[b.approved[1],b.approved[0]]),...t.track.map(q=>[q[1],q[0]])];
 if(pts.length&&!drawTrip.fitted){map.fitBounds(L.latLngBounds(pts).pad(.3),{maxZoom:14});drawTrip.fitted=true}
}
function importGpx(){const i=document.createElement("input");i.type="file";i.accept=".gpx,.kml,application/gpx+xml,application/vnd.google-earth.kml+xml";
 i.onchange=async()=>{const txt=await i.files[0].text();const doc=new DOMParser().parseFromString(txt,"application/xml");const out=[];
  doc.querySelectorAll("trkpt,rtept").forEach(e=>{const tm=e.querySelector("time");out.push([+e.getAttribute("lon"),+e.getAttribute("lat"),tm?Date.parse(tm.textContent):null,0])});
  if(!out.length){const wh=[...doc.getElementsByTagName("when")].map(w=>Date.parse(w.textContent));const co=[...doc.getElementsByTagName("gx:coord")].map(c=>c.textContent.trim().split(/\s+/).map(Number));
   co.forEach((c,k)=>out.push([c[0],c[1],wh[k]||null,0]));
   if(!out.length)[...doc.getElementsByTagName("coordinates")].forEach(c=>c.textContent.trim().split(/\s+/).forEach(tk=>{const a=tk.split(",").map(Number);out.push([a[0],a[1],null,0])}))}
  const t0=Date.now()-out.length*30000;out.forEach((p,k)=>{if(!p[2])p[2]=t0+k*30000});
  const t=trip()||openTrip();if(!t){toast("Open a trip first");return}
  const have=new Set(t.track.map(p=>p[2]));t.track=[...t.track,...out.filter(p=>!have.has(p[2]))].sort((a,b)=>a[2]-b[2]);save();drawTrip.fitted=false;tripView();toast(out.length+" track points added")};i.click()}

/* boreholes */
function holes(){
 const t=trip()||openTrip()||S.trips[S.trips.length-1];
 if(!t){$("#main").innerHTML=`<div class="card"><h2>No trip yet</h2><p class="muted">Start a trip on the Home page.</p></div>`;return}
 const canDrill=["on_site","drilling","returning"].includes(t.status);
 $("#main").innerHTML=`<div class="card"><div class="small muted">${esc(t.trip_id)} · ${esc(t.client)}</div><h2>${t.boreholes.length} of ${t.planned_boreholes} planned borehole(s)</h2>
 ${canDrill?"":`<div class="warnbox">Press “Arrived on site” on the Home page before recording boreholes.</div>`}</div>
 ${t.boreholes.map((b,i)=>{const g=OUT_GROUP[b.status]||"pending";const first=t.boreholes.findIndex(x=>["planned","drilling"].includes(x.status))===i;const off=b.actual&&b.approved?dist(b.actual,b.approved):null;return`<details ${first?"open":""}><summary><span class="chip ${g==="success"?"ok":g==="fail"?"bad":g==="stopped"?"warn":""}">${esc(OUT_LABEL[b.status])}</span>${esc(b.label)}</summary><div class="in">
  ${b.status==="planned"?`<button class="btn pri" data-start="${i}" ${canDrill?"":"disabled"}>Start drilling ${esc(b.label.split(" ")[0])} here</button>`:""}
  ${off!==null?`<div class="${off>OFFSITE_M?"badbox":"okbox"}">Drilled ${off.toFixed(0)} m from the approved point${off>OFFSITE_M?" – more than 50 m: WARMA must approve the move":""}</div>`:""}
  ${b.status!=="planned"?`<label>What happened?</label><select data-out="${i}"><option value="drilling" ${b.status==="drilling"?"selected":""}>Still drilling</option>
   ${OUTCOMES.map(([g,l])=>`<optgroup label="${g}">${l.map(([c,t])=>`<option value="${c}" ${b.status===c?"selected":""}>${esc(t)}</option>`).join("")}</optgroup>`).join("")}</select>
   <label>Depth drilled (m)</label><input data-depth="${i}" inputmode="decimal" value="${esc(b.depth_m||"")}">
   <label>Notes (reason, what you saw)</label><textarea data-note="${i}">${esc(b.note||"")}</textarea>
   <div class="thumbs">${(b.photos||[]).map(p=>`<img src="${p.data}" alt="">`).join("")}</div>
   <div class="row"><button class="btn" data-bph="${i}">📷 Photo</button><button class="btn pri" data-fin="${i}">Save outcome</button></div>`:""}
 </div></details>`}).join("")}
 ${canDrill?`<button class="btn" id="extra">＋ Extra borehole (needs WARMA approval)</button>`:""}`;
 document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{const h=t.boreholes[+b.dataset.start];const p=lastFix();
  h.status="drilling";h.started_at=nowISO();if(p)h.actual=[p[0],p[1]];t.status="drilling";ev(t,"bh_start",h.label);save();holes();
  if(p&&h.approved){const d=dist(p,h.approved);if(d>OFFSITE_M)toast(`Warning: you are ${d.toFixed(0)} m from the approved point`,5000)}else if(!p)toast("No GPS fix – start GPS so WARMA can see where you drilled")});
 document.querySelectorAll("[data-bph]").forEach(b=>b.onclick=()=>photoInput(ph=>{const h=t.boreholes[+b.dataset.bph];(h.photos=h.photos||[]).push(ph);save();holes()}));
 document.querySelectorAll("[data-fin]").forEach(b=>b.onclick=()=>{const i=+b.dataset.fin,h=t.boreholes[i];
  const out=document.querySelector(`[data-out="${i}"]`).value,dep=parseFloat(document.querySelector(`[data-depth="${i}"]`).value)||0;
  h.note=document.querySelector(`[data-note="${i}"]`).value.trim();
  if(out!=="drilling"&&OUT_GROUP[out]!=="stopped"&&!dep){toast("Enter the depth drilled");return}
  if(["other","access","client","unsafe","relocated"].includes(out)&&!h.note){toast("Please explain in the notes");return}
  h.status=out;h.depth_m=dep;
  if(out!=="drilling"){h.completed_at=nowISO();ev(t,"bh_done",`${h.label}: ${OUT_LABEL[out]}`);
   const p=lastFix();if(p&&!h.actual)h.actual=[p[0],p[1]];
   if(!t.boreholes.some(x=>x.status==="drilling"))t.status="on_site";
   const s=bcrState(h);toast(s.st==="open"?"Saved. BCR due in 3 days – "+fmt(s.due):"Saved.",4500)}
  save();holes()});
 const x=$("#extra");if(x)x.onclick=()=>{const p=lastFix();if(!p){toast("Need a GPS fix for an extra hole");return}
  t.boreholes.push({bh_id:`${t.trip_id}-BH${t.boreholes.length+1}`,label:`BH${t.boreholes.length+1} ${t.client} (extra)`,approved:null,status:"planned",extra:true});t.planned_boreholes=Math.max(t.planned_boreholes,t.boreholes.length);save();holes()};
}

/* BCR */
function bcr(){
 const rows=[];S.trips.forEach(t=>t.boreholes.forEach(b=>{const s=bcrState(b);if(s.st!=="none")rows.push([t,b,s])}));
 if(!rows.length){$("#main").innerHTML=`<div class="card"><h2>Borehole Completion Reports</h2><p class="muted">A BCR is needed for every borehole that was drilled (successful or failed). It is due 3 days after the hole is finished. Nothing is due now.</p></div>`;return}
 rows.sort((a,b)=>(a[2].st==="done")-(b[2].st==="done")||(a[2].due-b[2].due));
 $("#main").innerHTML=`<div class="card"><h2>Borehole Completion Reports</h2><p class="small muted">Due 3 days after each borehole. Fill on site, then press Send.</p></div>`+rows.map(([t,b,s],k)=>{const v=b.bcr||{};
  const tag=s.st==="done"?`<span class="chip ok">sent ${fmt(v.submitted_at)}</span>`:s.st==="late"?`<span class="chip bad">LATE by ${leftText(s.left)}</span>`:`<span class="chip ${s.st==="soon"?"warn":""}">${leftText(s.left)} left</span>`;
  return`<details ${k===0&&s.st!=="done"?"open":""}><summary>${tag}${esc(b.label)}</summary><div class="in">
   <div class="small muted">${esc(OUT_LABEL[b.status])} · finished ${fmt(b.completed_at)} · due ${fmt(s.due)}</div>
   ${BCR_FIELDS.map(([key,l,ty])=>`<label>${esc(l)}</label><input data-k="${key}" data-b="${k}" ${ty==="number"?'inputmode="decimal"':""} value="${esc(v[key]??(key==="depth_m"?b.depth_m:"")??"")}">`).join("")}
   <label>Lithology log</label><div data-litho="${k}">${(v.lithology||[]).map((r,j)=>lithoRow(k,j,r)).join("")}</div>
   <button class="btn" data-addl="${k}">＋ Add layer</button>
   <label>Signed by (name)</label><input data-k="signed_by" data-b="${k}" value="${esc(v.signed_by||S.profile.crew.supervisor)}">
   <div class="thumbs">${(v.photos||[]).map(p=>`<img src="${p.data}" alt="">`).join("")}</div>
   <div class="row"><button class="btn" data-bcrph="${k}">📷 Photo of signed form</button><button class="btn" data-savebcr="${k}">Save draft</button></div>
   <button class="btn ok big" data-subbcr="${k}">${s.st==="done"?"Update BCR":"BCR complete – ready to send"}</button></div></details>`}).join("");
 const get=k=>{const b=rows[k][1];b.bcr=b.bcr||{};document.querySelectorAll(`[data-b="${k}"]`).forEach(i=>b.bcr[i.dataset.k]=i.value.trim());
  b.bcr.lithology=[...document.querySelectorAll(`[data-litho="${k}"] .lr`)].map(r=>({from:r.querySelector(".f").value,to:r.querySelector(".t").value,material:r.querySelector(".m").value})).filter(r=>r.from!==""||r.to!=="");return b};
 document.querySelectorAll("[data-addl]").forEach(b=>b.onclick=()=>{const k=+b.dataset.addl;get(k);const bb=rows[k][1];const L_=bb.bcr.lithology;const last=L_.length?L_[L_.length-1].to:0;L_.push({from:last,to:"",material:""});save();bcr()});
 document.querySelectorAll("[data-savebcr]").forEach(b=>b.onclick=()=>{get(+b.dataset.savebcr);save();toast("Draft saved")});
 document.querySelectorAll("[data-bcrph]").forEach(b=>b.onclick=()=>{const k=+b.dataset.bcrph;get(k);photoInput(ph=>{const bb=rows[k][1];(bb.bcr.photos=bb.bcr.photos||[]).push(ph);save();bcr()})});
 document.querySelectorAll("[data-subbcr]").forEach(b=>b.onclick=()=>{const k=+b.dataset.subbcr,bb=get(k);
  const need=["depth_m"];const g=OUT_GROUP[bb.status];if(g==="success")need.push("swl_m","yield_ls","casing");if(g==="fail")need.push("backfill");
  const miss=need.filter(n=>!bb.bcr[n]);if(miss.length){toast("Please fill: "+miss.map(n=>BCR_FIELDS.find(f=>f[0]===n)[1]).join(", "),5000);return}
  bb.bcr.submitted_at=nowISO();const t=rows[k][0];ev(t,"bcr",bb.label);save();toast("BCR marked complete – press Send to deliver it to WARMA",4500);bcr()});
}
function lithoRow(k,j,r){return`<div class="row lr" style="margin-bottom:6px"><input class="f" placeholder="from m" inputmode="decimal" value="${esc(r.from)}"><input class="t" placeholder="to m" inputmode="decimal" value="${esc(r.to)}">
 <select class="m"><option value="">material</option>${LITHO.map(m=>`<option ${m===r.material?"selected":""}>${m}</option>`).join("")}</select></div>`}

/* send */
function packet(){
 const P=S.profile;
 return{format:FORMAT,version:VERSION,app:APP,sent_at:nowISO(),
  company:{licence:P.licence,name:P.company,class:P.class,phone:P.phone},
  rig:{...P.rig,depot:P.depot,supervisor:P.crew.supervisor,supervisor_phone:P.crew.phone},crew:P.crew,
  trips:S.trips.map(t=>({...t,boreholes:t.boreholes.map(b=>({...b,photos:(b.photos||[]).length,bcr:b.bcr?{...b.bcr,photos:(b.bcr.photos||[]).length}:undefined})),
   clearances:t.clearances.map(c=>({...c,photos:(c.photos||[]).length}))}))};
}
function send(){
 const pk=packet();const n=JSON.stringify(pk).length;const pts=S.trips.reduce((a,t)=>a+t.track.length,0);
 $("#main").innerHTML=`<div class="card"><h2>Send to WARMA DrillTrack</h2>
  <p class="small muted">Sends your trip status, GPS path, borehole outcomes and BCRs. Send at least once a day, and every time a borehole is finished.</p>
  <div class="kv"><b>Trips</b><span>${S.trips.length}</span><b>GPS points</b><span>${pts}</span><b>Size</b><span>${(n/1024).toFixed(0)} KB</span><b>Last sent</b><span>${fmt(S.sent)}</span></div>
  ${S.settings.sync?`<button class="btn pri big" id="post">Send now (internet)</button>`:""}
  <button class="btn ${S.settings.sync?"":"pri big"}" id="share">Share file (WhatsApp / email)</button>
  <button class="btn" id="dl">Save file to phone</button>
  <button class="btn" id="photos">Share photos (forms, BCRs)</button></div>
 <details><summary>Live tracking and settings</summary><div class="in">
  <label>Live GPS server (Traccar, OsmAnd protocol) – from WARMA</label><input id="tr" value="${esc(S.settings.traccar)}" placeholder="https://track.example.org:5055">
  <label>Device ID used for live tracking</label><input id="tid" value="${esc(S.profile.rig.tracker_id)}">
  <label>Upload address (optional, from WARMA)</label><input id="sync" value="${esc(S.settings.sync)}" placeholder="https://…">
  <label>Record a GPS point every (seconds)</label><input id="every" inputmode="numeric" value="${S.settings.every}">
  <button class="btn" id="sv">Save settings</button>
  <button class="btn" id="gpxout">Export my track (GPX)</button>
  <button class="btn bad" id="wipe">Remove closed trips older than 30 days</button>
  <button class="btn bad" id="out">Sign out (keeps nothing)</button></div></details>`;
 const blob=()=>new Blob([JSON.stringify(packet())],{type:"application/json"});
 const fname=()=>`DrillTrack_${S.profile.rig.rig_id}_${new Date().toISOString().slice(0,16).replace(/[:T]/g,"")}.json`;
 const mark=()=>{S.sent=nowISO();save();send()};
 $("#share").onclick=async()=>{const f=new File([blob()],fname(),{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"DrillTrack update",text:`${S.profile.company} ${S.profile.rig.reg_no} DrillTrack update`});mark()}catch(e){}}else{download(blob(),fname());mark();toast("Sharing is not available here – the file was saved instead")}};
 $("#dl").onclick=()=>{download(blob(),fname());mark()};
 $("#photos").onclick=async()=>{const files=[];S.trips.forEach(t=>{[...t.clearances.flatMap(c=>(c.photos||[]).map(p=>[t.trip_id+"_"+c.code,p])),...t.boreholes.flatMap(b=>[...(b.photos||[]),...((b.bcr||{}).photos||[])].map(p=>[b.bh_id,p]))].forEach(([n,p],k)=>files.push(dataFile(p.data,`${n}_${k+1}.jpg`)))});
  if(!files.length){toast("No photos yet");return}
  if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,title:"DrillTrack photos"})}catch(e){}}else files.forEach(f=>download(f,f.name))};
 const p=$("#post");if(p)p.onclick=async()=>{try{const r=await fetch(S.settings.sync,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(packet())});if(!r.ok)throw new Error(r.status);mark();toast("Sent to WARMA")}catch(e){toast("Could not send ("+e.message+"). Use Share file instead.")}};
 $("#sv").onclick=()=>{S.settings.traccar=$("#tr").value.trim();S.settings.sync=$("#sync").value.trim();S.settings.every=Math.max(5,parseInt($("#every").value)||30);S.profile.rig.tracker_id=$("#tid").value.trim()||S.profile.rig.rig_id;save();toast("Saved");send()};
 $("#gpxout").onclick=()=>{const t=trip()||S.trips[S.trips.length-1];if(!t||!t.track.length){toast("No track yet");return}
  const g=`<?xml version="1.0"?><gpx version="1.1" creator="${APP}" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>${esc(t.trip_id)}</name><trkseg>${t.track.map(p=>`<trkpt lat="${p[1]}" lon="${p[0]}"><time>${new Date(p[2]).toISOString()}</time></trkpt>`).join("")}</trkseg></trk></gpx>`;
  download(new Blob([g],{type:"application/gpx+xml"}),`${t.trip_id}.gpx`)};
 $("#wipe").onclick=()=>{const cut=Date.now()-30*864e5;const before=S.trips.length;S.trips=S.trips.filter(t=>!["completed","cancelled"].includes(t.status)||new Date(t.return_at||t.created_at).getTime()>cut||t.boreholes.some(b=>["late","soon","open"].includes(bcrState(b).st)));save();toast(`${before-S.trips.length} old trip(s) removed`);send()};
 $("#out").onclick=()=>{if(confirm("Sign out and delete everything on this phone? Send to WARMA first.")){localStorage.removeItem(KEY);S=load();gpsOff();render()}};
}
function download(b,name){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function dataFile(d,name){const [h,b]=d.split(",");const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new File([u],name,{type:"image/jpeg"})}

/* resume GPS if a trip is moving */
(()=>{const t=openTrip();if(t&&["travelling","on_site","drilling","returning"].includes(t.status))setTimeout(gpsOn,800)})();
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
setInterval(()=>{if(S.profile&&(S.tab==="home"||S.tab==="bcr"))nav()},60000);
render();
</script>
</body>
</html>
